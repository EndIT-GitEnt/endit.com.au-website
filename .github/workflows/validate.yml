name: Validate website

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

      - name: Verify the Cloudflare Worker bundle
        run: bun run wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

      - name: Smoke test the built Worker
        run: bash scripts/smoke-worker.sh
